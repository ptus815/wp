name: 生成 WARP MASQUE 配置 (Zero Trust 可选)

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 设备名(ZT 仪表盘显示用)
        required: false
        default: gh-actions
      retention_days:
        description: artifact 保留天数
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 下载 usque
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/Diniboy1123/usque/releases/latest \
                | jq -r '.tag_name' | sed 's/^v//')
          echo "usque 版本 $VER"
          curl -sL -o usque.zip \
            "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip
          chmod +x usque
          ./usque version 2>/dev/null | grep -i version || true

      - name: 注册设备并生成密钥
        run: |
          set -euo pipefail
          # 配了 ZT_JWT secret 就走 Zero Trust 注册,否则退回免费匿名注册
          if [ -n "${ZT_JWT:-}" ]; then
            echo "使用 Zero Trust 团队 token 注册"
            ./usque register -a -n "${{ github.event.inputs.device_name || 'gh-actions' }}" --jwt "$ZT_JWT"
          else
            echo "未配置 ZT_JWT,使用免费匿名注册"
            ./usque register -a -n "${{ github.event.inputs.device_name || 'gh-actions' }}"
          fi
          test -s config.json
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          print("endpoint_v4 =", c["endpoint_v4"])
          print("内网地址 =", c["ipv4"], "/", c["ipv6"])
          PY

      - name: 生成 mihomo 配置
        run: python3 scripts/gen_masque.py config.json dist

      - name: 校验配置可加载
        run: |
          set -euo pipefail
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases \
                | grep -o 'https://[^"]*mihomo-linux-amd64-alpha[^"]*\.gz' | head -1)
          curl -sL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          mkdir -p check
          cp dist/warp-masque.yaml check/config.yaml
          ./mihomo -t -d check
          echo "配置校验通过"

      - name: 打包凭据与配置
        run: |
          cp config.json dist/usque-config.json
          test -s dist/warp-masque.yaml
          test -s dist/warp-masque-shadowrocket.txt
          ls -l dist

      - name: 上传 artifact
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-config
          path: dist/
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          if-no-files-found: error